[package]
name = "korean-dict-epub"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Convert NIKL dictionary XML files into sequential-reading EPUB 3 books"
license = "MIT"
repository = "https://github.com/john33fiao/korean-dict-epub"
publish = false

[dependencies]
atomic-write-file = "=0.3.0"
clap = { version = "4.6.1", features = ["derive"] }
quick-xml = "0.41.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.11.0"
uuid = { version = "=1.24.0", features = ["v5"] }
zip = { version = "=7.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"
